services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: dentosmart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/dentosmart
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - .:/app

  frontend:
    build: ../web-react
    command: npm run dev -- --host 0.0.0.0 --port 5173
    env_file:
      - ../web-react/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../web-react:/app
      - /app/node_modules

volumes:
  postgres_data:
