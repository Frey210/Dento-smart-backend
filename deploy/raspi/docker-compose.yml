services:
  db:
    image: postgres:15-alpine
    container_name: dento-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dento_smart}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - dento_pg:/var/lib/postgresql/data
    networks:
      - dento_net

  backend:
    build:
      context: ${BACKEND_PATH}
      dockerfile: Dockerfile
    container_name: dento-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/dento_smart}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DEVICE_API_KEY: ${DEVICE_API_KEY:-change-me}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      DEVICE_RATE_LIMIT_PER_MINUTE: ${DEVICE_RATE_LIMIT_PER_MINUTE:-120}
      DEVICE_OFFLINE_MINUTES: ${DEVICE_OFFLINE_MINUTES:-5}
      SESSION_INACTIVITY_MINUTES: ${SESSION_INACTIVITY_MINUTES:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3002,https://dento-smart.inkubasistartupunhas.id}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://dento-smart.inkubasistartupunhas.id}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    networks:
      - dento_net

  frontend:
    build:
      context: ${FRONTEND_PATH}
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://dento-backend.inkubasistartupunhas.id}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-wss://dento-backend.inkubasistartupunhas.id}
    container_name: dento-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3002}:80"
    networks:
      - dento_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dento-cloudflared
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: tunnel run
    depends_on:
      - frontend
      - backend
    networks:
      - dento_net

networks:
  dento_net:
    name: dento_net

volumes:
  dento_pg:
